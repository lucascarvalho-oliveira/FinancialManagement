spring:
  application:
    name: FinancialManagement

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

resend:
  api-key: ${RESEND_API_KEY}

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${PORT:8080}