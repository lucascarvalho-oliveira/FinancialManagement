spring:
  application:
    name: FinancialManagement

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

resend:
  api-key: ${RESEND_API_KEY}

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${PORT:8080}